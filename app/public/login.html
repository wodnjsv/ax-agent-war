<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>W01 운영 시스템 · 접속</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      font: 14px/1.5 -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: #1C2127; background: #F6F7F9; }
    form { width: 100%; max-width: 360px; background: #FFFFFF; border-radius: 3px; padding: 24px;
      box-shadow: 0 0 0 1px rgba(17, 20, 24, 0.1), 0 1px 1px rgba(17, 20, 24, 0.2); }
    h1 { margin: 0 0 4px; font-size: 18px; }
    p { margin: 0 0 16px; color: #5F6B7C; }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    input { width: 100%; height: 36px; padding: 0 10px; font: inherit; border: 1px solid #ABB3BF; border-radius: 3px; }
    input:focus, button:focus-visible { outline: none; box-shadow: 0 0 0 2px rgba(45, 114, 210, 0.6); }
    button { width: 100%; height: 36px; margin-top: 12px; font: inherit; font-weight: 600; color: #FFFFFF; background: #2D72D2; border: 0; border-radius: 3px; cursor: pointer; }
    button:hover { background: #215DB0; }
    button:disabled { background: #ABB3BF; cursor: default; }
    #msg { min-height: 21px; margin: 8px 0 0; color: #AC2F33; }
  </style>
</head>
<body>
  <form id="login">
    <h1>캠페인 기안 도우미</h1>
    <p>W01 캠페인 수요·공급 운영 시스템입니다. 실행 안내에 적힌 비밀번호를 입력해 주세요.</p>
    <label for="pw">비밀번호</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus required>
    <button type="submit">들어가기</button>
    <p id="msg" role="alert"></p>
  </form>
  <script>
    const form = document.getElementById('login');
    const msg = document.getElementById('msg');
    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const btn = form.querySelector('button');
      btn.disabled = true;
      msg.textContent = '';
      try {
        const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('pw').value }) });
        if (res.ok) return location.reload();
        msg.textContent = (await res.json()).error ?? '들어갈 수 없습니다';
      } catch {
        msg.textContent = '서버에 연결하지 못했습니다';
      }
      btn.disabled = false;
    });
  </script>
</body>
</html>
